# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:name: Daily Auto Commit

on:
  schedule:
    - cron: '0 12 * * *'  # Runs every day at 12:00 PM UTC
  workflow_dispatch:      # Allows you to run it manually at any time

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Grants permission to push commits
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Commits
        run: |
          # Configure Git identity
          git config --global user.name "ganeshjauk"
          git config --global user.email "jaukganesh294@gmail.com"
          
          # Randomly generate a number of commits between 0 and 20
          NUM_COMMITS=$((RANDOM % 21))
          echo "Making $NUM_COMMITS commits today."
          
          for i in $(seq 1 $NUM_COMMITS); do
            # Modify a dummy file to create unique commits
            echo "Heartbeat at $(date)" >> heartbeat.txt
            
            # Stage, commit, and push
            git add heartbeat.txt
            git commit -m "chore: automated daily commit $i"
            git push origin main
          done


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
