name: Daily Auto Commit

on:
  schedule:
    - cron: '0 12 * * *'  # Runs every day at 12:00 PM UTC
  workflow_dispatch:      # Allows you to run it manually at any time

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Grants permission to push commits
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main       # Forces checkout of main branch instead of detached HEAD

      - name: Make Commits
        run: |
          # Configure Git identity
          git config --global user.name "ganeshjauk"
          git config --global user.email "jaukganesh294@gmail.com"
          
          # Randomly generate a number of commits between 0 and 20
          NUM_COMMITS=$((RANDOM % 21))
          echo "Making $NUM_COMMITS commits today."
          
          # If 0 commits are selected, exit early gracefully
          if [ $NUM_COMMITS -eq 0 ]; then
            echo "Zero commits chosen for today."
            exit 0
          fi
          
          # Make all commits locally first
          for i in $(seq 1 $NUM_COMMITS); do
            echo "Heartbeat at $(date +%s) - Commit $i" >> heartbeat.txt
            git add heartbeat.txt
            git commit -m "chore: automated daily commit $i"
          done
          
          # Pull latest changes to avoid conflicts, then push everything at once
          git pull origin main --rebase
          git push origin main
